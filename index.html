

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary Prices</title>

<link rel="stylesheet" href="universal.css">

<style>
    /* Tighten logo spacing */
    #mf-header {
        text-align: center;
        padding-top: 4px;
    }

    #mf-logo {
        display: block;
        width: 64px;
        margin: 0 auto;
        margin-bottom: 2px; /* critical spacing fix */
    }

    h1 {
        font-size: 28px;
        margin: 0;
        padding: 0;
    }

    h2 {
        font-size: 16px;
        margin-top: 4px;
        color: #555;
    }

    .price-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        font-size: 18px;
    }

    .buy-btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 16px;
    }
</style>

</head>
<body>

<div id="mf-header">
    <img id="mf-logo" src="IMG_1741.jpg" alt="MicroFoundary Logo">
    <h1>MicroFoundary Prices</h1>
    <h2>Current pricing for all microwidgets</h2>
</div>

<div class="price-item">
    <span>Clarifier</span>
    <span>$3</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>StarterWidget</span>
    <span>$3</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>QuickCounter</span>
    <span>$5</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>PulseCounter</span>
    <span>$7</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>AutoFormatter</span>
    <span>$6</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>AutoWriter</span>
    <span>$5</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span>MicroNote</span>
    <span>$6</span>
    <button class="buy-btn">Buy</button>
</div>

</body>
</html>
