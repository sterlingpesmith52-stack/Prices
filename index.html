<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MicroFoundary • Prices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #111;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .price-list {
      font-size: 15px;
      line-height: 1.6;
    }

    .item {
      display: flex;
      justify-content: space-between;
      max-width: 300px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .name {
      font-weight: 500;
    }

    .price {
      font-weight: 600;
      color: #007aff;
    }
  </style>
</head>

<body>

  <!-- Logo top-left -->
  <img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo" />

  <!-- Page title -->
  <div class="title">MicroFoundary • Prices</div>
  <div class="subtitle">Current pricing for all microwidgets</div>

  <!-- Left-aligned price list -->
  <div class="price-list">

    <div class="item">
      <div class="name">Clarifier</div>
      <div class="price">$3</div>
    </div>

    <div class="item">
      <div class="name">StarterWidget</div>
      <div class="price">$3</div>
    </div>

    <div class="item">
      <div class="name">QuickCounter</div>
      <div class="price">$5</div>
    </div>

    <div class="item">
      <div class="name">PulseCounter</div>
      <div class="price">$7</div>
    </div>

    <div class="item">
      <div class="name">AutoFormatter</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">AutoWriter</div>
      <div class="price">$5</div>
    </div>

    <div class="item">
      <div class="name">MicroNote</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">TimeStampTool</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">MicroTimer</div>
      <div class="price">$7</div>
    </div>

    <div class="item">
      <div class="name">MicroCopy</div>
      <div class="price">$7</div>
    </div>

  </div>

</body>
</html>
