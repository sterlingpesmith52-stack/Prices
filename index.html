
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MicroFoundary Prices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #111111;
    }

    /* Correct MicroFoundary logo proportions */
    .logo {
      width: 128px;          /* wider footprint */
      height: 52px;          /* shorter vertical footprint */
      object-fit: contain;
      display: block;
      margin: 0 0 12px 0;    /* minimal vertical space */
    }

    .title {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #555555;
      margin-bottom: 20px;
    }

    .price-list {
      font-size: 16px;
      line-height: 1.6;
      max-width: 360px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .name {
      font-weight: 500;
      color: #111111;
    }

    .price {
      font-weight: 600;
      color: #111111;
      margin-right: 12px; /* spacing before Buy button */
    }

    .buy-btn {
      background: #007aff;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px; /* right padding (your request) */
    }

    .buy-btn:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- Correct logo footprint -->
  <img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo" />

  <div class="title">MicroFoundary Prices</div>
  <div class="subtitle">Current pricing for all microwidgets</div>

  <div class="price-list">

    <div class="item">
      <div class="name">Clarifier</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$3</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=Clarifier'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">StarterWidget</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$3</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=StarterWidget'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">QuickCounter</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$5</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=QuickCounter'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">PulseCounter</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$7</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=PulseCounter'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">AutoFormatter</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$6</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=AutoFormatter'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">AutoWriter</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$5</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=AutoWriter'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">MicroNote</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$6</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=MicroNote'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">TimeStampTool</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$6</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=TimeStampTool'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">MicroTimer</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$7</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=MicroTimer'">Buy</button>
      </div>
    </div>

    <div class="item">
      <div class="name">MicroCopy</div>
      <div style="display:flex;align-items:center;">
        <div class="price">$7</div>
        <button class="buy-btn" onclick="location.href='payment.html?tool=MicroCopy'">Buy</button>
      </div>
    </div>

  </div>

</body>
</html>
