
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary Prices</title>

<link rel="stylesheet" href="universal.css">

<style>
    /* Header block left aligned */
    #mf-header {
        text-align: left;
        padding-top: 4px;
        padding-left: 12px;
    }

    /* Full-size logo + tight spacing */
    #mf-logo {
        display: block;
        width: 128px;          /* full MicroFoundary standard size */
        margin: 0;
        margin-bottom: 2px;    /* tight gap above title */
    }

    h1 {
        font-size: 28px;
        margin: 0;
        padding: 0;
    }

    h2 {
        font-size: 16px;
        margin-top: 4px;
        color: #555;
    }

    /* Pricing list layout */
    .price-item {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        font-size: 18px;
        padding-left: 12px;
    }

    .item-name {
        width: 160px;   /* fixed column width for perfect alignment */
        text-align: left;
    }

    .item-price {
        width: 60px;    /* fixed price column */
        text-align: left;
    }

    .buy-btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 16px;
        margin-left: 12px;
    }
</style>

</head>
<body>

<div id="mf-header">
    <img id="mf-logo" src="IMG_1741.jpeg" alt="MicroFoundary Logo">
    <h1>MicroFoundary Prices</h1>
    <h2>Current pricing for all microwidgets</h2>
</div>

<div class="price-item">
    <span class="item-name">Clarifier</span>
    <span class="item-price">$3</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">StarterWidget</span>
    <span class="item-price">$3</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">QuickCounter</span>
    <span class="item-price">$5</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">PulseCounter</span>
    <span class="item-price">$7</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">AutoFormatter</span>
    <span class="item-price">$6</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">AutoWriter</span>
    <span class="item-price">$5</span>
    <button class="buy-btn">Buy</button>
</div>

<div class="price-item">
    <span class="item-name">MicroNote</span>
    <span class="item-price">$6</span>
    <button class="buy-btn">Buy</button>
</div>

</body>
</html>
