<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prices</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ffffff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:18px;
    max-width:500px;
    margin:0 auto;
}

.logo{
    width:190px;
    height:auto;
    display:block;
    margin-bottom:8px;
}

h1{
    font-size:30px;
    font-weight:700;
    line-height:1.1;
    margin-bottom:14px;
}

.price-list{
    width:100%;
}

.tool-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    text-decoration:none;
}

.tool-name{
    color:#007bff;
    text-decoration:underline;
    font-size:22px;
    font-weight:600;
}

.tool-row:visited .tool-name{
    color:#007bff;
}

.tool-row:hover .tool-name{
    color:#0056cc;
}

.tool-price{
    color:#111;
    font-size:22px;
    font-weight:600;
    white-space:nowrap;
    margin-left:18px;
}

</style>
</head>

<body>

<img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo">

<h1>Prices</h1>

<div class="price-list">

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/QuickCounter/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">QuickCounter</span>
        <span class="tool-price">$3</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/PulseCounter/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">PulseCounter</span>
        <span class="tool-price">$8</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/AutoFormatter/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">AutoFormatter</span>
        <span class="tool-price">$3</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/AutoWriter/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">AutoWriter</span>
        <span class="tool-price">$9</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/MicroNote/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">MicroNote</span>
        <span class="tool-price">$4</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/TimestampTool/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">TimestampTool</span>
        <span class="tool-price">$4</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/MicroTimer/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">MicroTimer</span>
        <span class="tool-price">$5</span>
    </a>

    <a class="tool-row"
       href="https://sterlingpesmith52-stack.github.io/Decider/"
       target="_blank"
       rel="noopener">
        <span class="tool-name">Decider</span>
        <span class="tool-price">$6</span>
    </a>

</div>

</body>
</html>
