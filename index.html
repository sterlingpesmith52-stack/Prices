<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroFoundary Prices</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:24px;
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#111;
}

.logo{
    width:280px;
    max-width:100%;
    height:auto;
    display:block;
    margin-bottom:20px;
}

h1{
    font-size:48px;
    font-weight:700;
    line-height:1.05;
    margin:0;
}

.subtitle{
    font-size:20px;
    color:#666;
    margin-top:12px;
    margin-bottom:30px;
}

.tool-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 0;
    border-bottom:1px solid #e5e5e5;
}

.tool-name{
    flex:1;
    font-size:24px;
    font-weight:500;
}

.tool-price{
    font-size:24px;
    font-weight:600;
    width:60px;
    text-align:center;
}

.buy-btn{
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:20px;
    font-weight:600;
    min-width:80px;
    text-align:center;
}

.buy-btn:hover{
    opacity:.9;
}

@media (max-width:480px){

    body{
        padding:20px;
    }

    .logo{
        width:240px;
    }

    h1{
        font-size:42px;
    }

    .subtitle{
        font-size:18px;
    }

    .tool-name{
        font-size:20px;
    }

    .tool-price{
        font-size:20px;
        width:50px;
    }

    .buy-btn{
        font-size:18px;
        padding:10px 16px;
        min-width:72px;
    }
}
</style>
</head>

<body>

<img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo">

<h1>MicroFoundary Prices</h1>

<div class="subtitle">
Current pricing for all microwidgets
</div>

<div class="tool-row">
    <div class="tool-name">QuickCounter</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">PulseCounter</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">AutoFormatter</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">AutoWriter</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">MicroNote</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">TimeStampTool</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">MicroTimer</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

<div class="tool-row">
    <div class="tool-name">Decider</div>
    <div class="tool-price">$0</div>
    <a href="#" class="buy-btn">Buy</a>
</div>

</body>
</html>
