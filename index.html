<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroFoundary Prices</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MicroFoundary Standard Header -->
    <div class="mf-header">
        <img src="IMG_1741.jpg" alt="MicroFoundary Logo" class="mf-logo">
        <h1 class="mf-title">Prices</h1>
        <p class="mf-detail">Quick reference price list</p>
    </div>

    <!-- Prices Widget Content -->
    <div class="mf-content">
        <p>Enter an item and its price below. This widget keeps your list simple and readable.</p>

        <div class="price-input-block">
            <input type="text" id="itemName" placeholder="Item name">
            <input type="number" id="itemPrice" placeholder="Price">
            <button onclick="addPrice()">Add</button>
        </div>

        <ul id="priceList"></ul>
    </div>

    <!-- Script -->
    <script>
        function addPrice() {
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();

            if (!name || !price) return;

            const list = document.getElementById('priceList');
            const li = document.createElement('li');
            li.textContent = name + ": $" + price;
            list.appendChild(li);

            document.getElementById('itemName').value = "";
            document.getElementById('itemPrice').value = "";
        }
    </script>

</body>
</html>
