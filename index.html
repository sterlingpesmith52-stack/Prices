<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MicroFoundary Prices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #111111;
    }

    /* Logo: left-aligned, not over-cropped, slightly larger */
    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;      /* show full logo without tight crop */
      border-radius: 12px;
      display: block;
      margin: 0 0 16px 0;
    }

    .title {
      font-size: 26px;          /* larger title */
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #555555;
      margin-bottom: 20px;
    }

    .price-list {
      font-size: 16px;
      line-height: 1.6;
    }

    .item {
      display: flex;
      justify-content: space-between;
      max-width: 320px;
      padding: 6px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .name {
      font-weight: 500;
      color: #111111;
    }

    .price {
      font-weight: 600;
      color: #111111;           /* no blue; neutral text */
    }
  </style>
</head>

<body>

  <!-- Logo top-left -->
  <img src="IMG_1741.jpeg" alt="MicroFoundary Logo" class="logo" />

  <!-- Title without dot -->
  <div class="title">MicroFoundary Prices</div>
  <div class="subtitle">Current pricing for all microwidgets</div>

  <!-- Left-aligned price list -->
  <div class="price-list">

    <div class="item">
      <div class="name">Clarifier</div>
      <div class="price">$3</div>
    </div>

    <div class="item">
      <div class="name">StarterWidget</div>
      <div class="price">$3</div>
    </div>

    <div class="item">
      <div class="name">QuickCounter</div>
      <div class="price">$5</div>
    </div>

    <div class="item">
      <div class="name">PulseCounter</div>
      <div class="price">$7</div>
    </div>

    <div class="item">
      <div class="name">AutoFormatter</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">AutoWriter</div>
      <div class="price">$5</div>
    </div>

    <div class="item">
      <div class="name">MicroNote</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">TimeStampTool</div>
      <div class="price">$6</div>
    </div>

    <div class="item">
      <div class="name">MicroTimer</div>
      <div class="price">$7</div>
    </div>

    <div class="item">
      <div class="name">MicroCopy</div>
      <div class="price">$7</div>
    </div>

  </div>

</body>
</html>
